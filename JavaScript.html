  var args=Array.prototype.slice.call(arguments,1);
  return new Promise(function(resolve,reject){
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[namaFungsi].apply(null,args);
  });
}

  tab_directory:'Tab & grid direktori jurnal', citation_impact:'Dampak sitasi publikasi',
  sinta_link:'Link profil SINTA',

Vue.createApp({
  data:function(){return{

    memuatData:false,data:null,galatData:'',tab:'ringkasan',
    // baru: shell sidebar gelap "inset" — filter menu, drawer mobile, preferensi tema
    cariMenu:'',navMobileTerbuka:false,tema:'auto',
    cari:'',filterKluster:'',filterSinta:'',filterTimeliness:'',filterMigrasi:'',filterScopus:'',
    filterKualitas:'',filterMasalah:'',urutan:'nama', // baru: filter & urutan berbasis kualitas data
    halaman:1,perHalaman:25,namaBulan:BULAN,modalBulan:null,memuatBulan:false,terpilihBulan:[],konfirmasiKirim:false,mengirim:false,hasilKirim:null,
    jurnalTerpilih:null,modeSunting:false,panelApc:false,draf:{},menyimpan:false,pesanModal:'',pesanModalJenis:'info',
    galatField:{}, // baru: pesan validasi per field dari simpanPerubahanJurnal
    tokenEdit:'',jurnalTokenEdit:'',panelPin:false,pinJurnal:'',mengirimPin:false,

    usulanDoi:[],statusDoiOptions:[],filterDoiStatus:'',filterDoiCari:'',memuatDoi:false,galatDoi:'',menyimpanDoi:false,
    doiTerpilih:null,pesanModalDoi:'',mengirimUlangReceipt:{pengajuan:false,aktivasi:false}, // baru: state modal detail DOI
    // baru: gate konfirmasi khusus transisi status DOI -> BERHASIL (memicu email otomatis)
    doiTerpilihStatusAsli:'',konfirmasiSimpanDoi:false,
    // baru: state panel PIN tetap (login cepat & pengaturan di tab Akun Saya)
    pinTetapInput:'',pinTetapBaru:'',pinTetapUlang:'',pesanPinTetap:'',pesanPinTetapJenis:'info',menyimpanPinTetap:false,
    // baru: state form "Catat Pengajuan Pencairan" di tab Pemasukan APC (admin-only)
    formPencairan:{namaJurnal:'',jumlahDiajukan:null,catatan:''},menyimpanPencairan:false,
    konfirmasiPencairan:false, // baru: gate konfirmasi sebelum menulis ke Log_Pencairan_APC (append-only, tanpa edit/hapus)
    pesanPencairan:'',pesanPencairanJenis:'info',
    // baru: filter & paginasi tabel "Riwayat Laporan APC"
    filterBulanApc:'',filterKlusterApc:'',halamanApc:1,
    filterTerbitanStatus:'', // baru: filter status pada tab Progress Terbitan
    filterAkrBucket:'', // baru: filter bucket kedaluwarsa pada tab Akreditasi
    // baru: state tab Template Email (superadmin-only)
    daftarTemplateEmail:[],templateAktifKunci:'',draftTemplateEmail:{subjek:'',isi:''},
    memuatTemplateEmail:false,menyimpanTemplateEmail:false,galatTemplateEmail:'',
    // baru: state tab Review Profil Jurnal (draft cover/scope, superadmin-only)
    draftProfilJurnal:[],memuatDraftProfil:false,galatDraftProfil:'',
    draftProfilTerpilih:null,memprosesDraftProfil:false,catatanTolakDraftInput:'',
    // baru: state tab Layout Landing (superadmin-only)
    pengaturanLanding:[],memuatPengaturanLanding:false,menyimpanPengaturanLanding:false,galatPengaturanLanding:''
  };},
  computed:{
    // baru: sapaan topbar mengikuti jam perangkat, dan inisial avatar dari email admin
    sapaan:function(){
      var h=new Date().getHours();
      return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
    },
    inisialProfil:function(){
      if(!this.profile||!this.profile.email) return '';
      var nama=this.profile.email.split('@')[0].replace(/[^a-zA-Z]+/g,' ').trim();
      var bagian=nama.split(/\s+/).filter(Boolean);
      if(!bagian.length) return this.profile.email.substring(0,2).toUpperCase();
      if(bagian.length===1) return bagian[0].substring(0,2).toUpperCase();
      return (bagian[0][0]+bagian[1][0]).toUpperCase();
    },
    // baru: nama pengelola dari bagian lokal email, untuk kartu pengguna di sidebar
    namaProfil:function(){
      if(!this.profile||!this.profile.email)return'';
      var n=this.profile.email.split('@')[0].replace(/[._\-]+/g,' ').trim();
      return n.replace(/\b\w/g,function(c){return c.toUpperCase();});
    },
    // baru: status toggle tema terang/gelap/ikut-sistem di topbar shell
    labelTema:function(){return{auto:'ikut sistem',light:'terang',dark:'gelap'}[this.tema];},
    ikonTema:function(){
      return this.tema==='light'?'fa-solid fa-sun':this.tema==='dark'?'fa-solid fa-moon':'fa-solid fa-circle-half-stroke';
    },
    // baru: menu sidebar dikelompokkan (pola litabmas.upi.edu). Badge angka ikut data.
    menuGroups:function(){
      var d=this.data,dq=this.dq,sup=this.profile&&this.profile.isSuperadmin;
      var grup=[
        {judul:'Monitoring',item:[
          {k:'ringkasan',label:'Ringkasan',ikon:'fa-solid fa-gauge'},
          {k:'jurnal',label:'Daftar Jurnal',ikon:'fa-solid fa-book-open',badge:d?d.journals.length:0},
          {k:'kualitas',label:'Kualitas Data',ikon:'fa-solid fa-shield-halved',badge:dq&&dq.bermasalah?dq.bermasalah:0},
          {k:'akreditasi',label:'Akreditasi',ikon:'fa-solid fa-award',badge:d&&d.akreditasi?(d.akreditasi.kalender.lewat+d.akreditasi.kalender.kritis):0}
        ]},
        {judul:'Operasional',item:[
          {k:'scopus',label:'Pipeline Scopus',ikon:'fa-solid fa-arrow-trend-up'},
          {k:'apc',label:'Pemasukan APC',ikon:'fa-solid fa-wallet'},
          {k:'terbitan',label:'Progress Terbitan',ikon:'fa-solid fa-timeline'},
          {k:'doi',label:'Usulan DOI',ikon:'fa-solid fa-link'}
        ]},
        {judul:'Akun & Admin',item:[
          {k:'akun',label:'Akun Saya',ikon:'fa-solid fa-user'}
        ]}
      ];
      if(sup){
        grup[2].item.push(
          {k:'template',label:'Template Email',ikon:'fa-solid fa-envelope-open-text'},
          {k:'draftProfil',label:'Review Profil Jurnal',ikon:'fa-solid fa-image',badge:this.draftProfilJurnal.length||0},
          {k:'layoutLanding',label:'Layout Landing',ikon:'fa-solid fa-table-cells'}
        );
      }
      return grup;
    },
    menuTersaring:function(){
      var q=this.cariMenu.trim().toLowerCase();
      if(!q)return this.menuGroups;
      return this.menuGroups.map(function(g){
        return{judul:g.judul,item:g.item.filter(function(m){return m.label.toLowerCase().indexOf(q)!==-1;})};
      }).filter(function(g){return g.item.length;});
    },
    judulTab:function(){
      var t=this.tab,f='Dashboard';
      this.menuGroups.forEach(function(g){g.item.forEach(function(m){if(m.k===t)f=m.label;});});
      return f;
    },
    fieldSunting:function(){return this.FIELD_ADMIN;},
    daftarKluster:function(){return this.data?this.data.clusters.map(function(x){return x.nama;}):[];},
    dq:function(){return this.data&&this.data.dataQuality?this.data.dataQuality:null;}, // baru
    levelDq:function(){return LEVEL_DQ;}, // baru
    // baru: daftar status tetap & laporan terbitan tersaring untuk tab Progress Terbitan
    statusTerbitanList:function(){return TERBITAN_STATUS_LIST;},
    // baru: jadwal reakreditasi tersaring menurut bucket yang dipilih di KPI tab Akreditasi
    jadwalAkrTersaring:function(){
      if(!this.data||!this.data.akreditasi)return[];
      var f=this.filterAkrBucket, arr=this.data.akreditasi.kalender.jadwal;
      return f?arr.filter(function(r){return r.kedaluwarsa.bucket===f;}):arr;
    },
    terbitanTersaring:function(){
      if(!this.data||!this.data.terbitan)return[];
      var items=this.data.terbitan.items||[];
      if(!this.filterTerbitanStatus)return items;
      var s=this.filterTerbitanStatus;
      return items.filter(function(t){return t.status===s;});
    },
    // baru: entri template email yang sedang dipilih di tab Template Email
    templateAktifData:function(){
      var s=this;
      return this.daftarTemplateEmail.find(function(t){return t.kunci===s.templateAktifKunci;})||null;
    },
    // baru: baris Pengaturan_Landing dikelompokkan untuk tab Layout Landing.
    // Label tampilan TIDAK disimpan di sheet (lihat Code.js section 26) --
    // dipetakan di sini, harus sinkron manual dengan LABEL_LAYOUT_LANDING.
    pengaturanLandingSections:function(){
      return this.pengaturanLanding.filter(function(p){return p.jenis==='section';})
        .slice().sort(function(a,b){return a.urutan-b.urutan;});
    },
    pengaturanLandingTabs:function(){
      return this.pengaturanLanding.filter(function(p){return p.jenis==='tab';})
        .slice().sort(function(a,b){return a.urutan-b.urutan;});
    },
    jurnalTersaring:function(){
      if(!this.data)return[];var q=this.cari.trim().toLowerCase(),s=this;
      var hasil=this.data.journals.filter(function(j){
        var teks=[j.namaJurnal,j.kluster,j.issn,j.unitPengelola].join(' ').toLowerCase();
        if(q&&teks.indexOf(q)<0)return false;
        if(s.filterKluster&&j.kluster!==s.filterKluster)return false;
        if(s.filterSinta==='belum'&&j.terakreditasi)return false;
        if(s.filterSinta==='terakreditasi'&&!j.terakreditasi)return false;
        if(s.filterSinta&&!['belum','terakreditasi'].includes(s.filterSinta)&&String(j.peringkatSinta)!==s.filterSinta)return false;
        if(s.filterTimeliness&&j.kategoriTimeliness!==s.filterTimeliness)return false;
        if(s.filterMigrasi==='sudah'&&!j.sudahMigrasi)return false;
        if(s.filterMigrasi==='belum'&&j.sudahMigrasi)return false;
        if(s.filterScopus==='ya'&&!j.bereputasi)return false;
        if(s.filterScopus==='tanpa-email'&&j.punyaEmail)return false;
        // baru: saring berdasarkan tingkat risiko kualitas data
        if(s.filterKualitas&&(!j.dq||j.dq.level!==s.filterKualitas))return false;
        // baru: saring berdasarkan satu jenis masalah spesifik, format "field|jenis"
        if(s.filterMasalah){
          if(!j.dq||!j.dq.masalah)return false;
          var pisah=s.filterMasalah.split('|'),ada=j.dq.masalah.some(function(m){return m.field===pisah[0]&&m.jenis===pisah[1];});
          if(!ada)return false;
        }
        return true;
      });
      // baru: urutan dapat diganti ke prioritas perbaikan data
      if(this.urutan==='risiko')hasil=hasil.slice().sort(function(a,b){
        var sa=a.dq?a.dq.skor:0,sb=b.dq?b.dq.skor:0;
        return sb-sa||a.namaJurnal.localeCompare(b.namaJurnal);
      });
      else if(this.urutan==='lengkap')hasil=hasil.slice().sort(function(a,b){
        var pa=a.dq?a.dq.persenLengkap:100,pb=b.dq?b.dq.persenLengkap:100;
        return pa-pb||a.namaJurnal.localeCompare(b.namaJurnal);
      });
      return hasil;
    },
    totalHalaman:function(){return Math.max(1,Math.ceil(this.jurnalTersaring.length/this.perHalaman));},
    jurnalHalamanIni:function(){var awal=(this.halaman-1)*this.perHalaman;return this.jurnalTersaring.slice(awal,awal+this.perHalaman);},
    adaFilterAktif:function(){return!!(this.cari||this.filterKluster||this.filterSinta||this.filterTimeliness||this.filterMigrasi||this.filterScopus||this.filterKualitas||this.filterMasalah);},
    // baru: sepuluh jurnal paling mendesak menurut skor server
    antreanKualitas:function(){
      if(!this.data)return[];
      return this.data.journals.filter(function(j){return j.dq&&j.dq.level!=='terkendali';})
        .slice().sort(function(a,b){return b.dq.skor-a.dq.skor||a.namaJurnal.localeCompare(b.namaJurnal);});
    },
    prioritas:function(){
      var a=this.data?this.data.journals:[];return{
        hutang:a.filter(function(j){return j.kategoriTimeliness==='Punya Hutang Terbitan';}).length,
        tanpaEmail:a.filter(function(j){return !j.punyaEmail;}).length,
        belumMigrasi:a.filter(function(j){return !j.sudahMigrasi;}).length
      };
    },
    semuaTerpilih:function(){return this.modalBulan&&this.terpilihBulan.length===this.modalBulan.daftar.filter(function(j){return j.punyaEmail&&!j.sudahDiingatkan;}).length;},
    tahapScopus:function(){return[{key:'tahap1',label:'Tahap 1 · Kandidat / Inkubasi'},{key:'tahap2',label:'Tahap 2 · Pembinaan aktif'},{key:'tahap3',label:'Tahap 3 · Submitted / CSAB'}];},
    // baru: daftar usulan DOI setelah disaring pencarian & status, dipakai tabel di tab Usulan DOI
    usulanDoiTersaring:function(){
      var q=this.filterDoiCari.trim().toLowerCase(),st=this.filterDoiStatus;
      return this.usulanDoi.filter(function(d){
        if(st&&d.status!==st)return false;
        if(!q)return true;
        var teks=[d.nama_jurnal,d.judul_artikel,d.penulis,d.nama_pemohon].join(' ').toLowerCase();
        return teks.indexOf(q)!==-1;
      });
    },
    // baru: pratinjau alokasi pencairan APC (10% UPI, 2% DPPM, sisanya dana terserap
    // jurnal). Murni tampilan — perhitungan resmi & final tetap dilakukan server.
    previewAlokasi:function(){
      var jumlah=Number(this.formPencairan.jumlahDiajukan)||0;
      var upi=Math.round(jumlah*PERSEN_ALOKASI_UPI);
      var dppm=Math.round(jumlah*PERSEN_ALOKASI_DPPM);
      return{upi:upi,dppm:dppm,terserap:jumlah-upi-dppm};
    },
    // baru: daftar bulan, hasil saring, dan paginasi untuk tabel "Riwayat Laporan APC"
    daftarBulanApc:function(){
      if(!this.data||!this.data.apc||!this.data.apc.riwayat)return[];
      var set={};
      this.data.apc.riwayat.forEach(function(r){set[r.timestamp.substring(0,7)]=true;});
      return Object.keys(set).sort().reverse();
    },
    riwayatApcTersaring:function(){
      if(!this.data||!this.data.apc||!this.data.apc.riwayat)return[];
      var b=this.filterBulanApc,k=this.filterKlusterApc;
      return this.data.apc.riwayat.filter(function(r){
        if(b&&r.timestamp.substring(0,7)!==b)return false;
        if(k&&r.kluster!==k)return false;
        return true;
      });
    },
    totalHalamanApc:function(){return Math.max(1,Math.ceil(this.riwayatApcTersaring.length/10));},
    riwayatApcHalamanIni:function(){var awal=(this.halamanApc-1)*10;return this.riwayatApcTersaring.slice(awal,awal+10);},
    // baru: true hanya kalau status yang dipilih di modal DOI adalah transisi BARU ke BERHASIL —
    // mencerminkan persis kondisi server (ubahStatusUsulanDoi di Code.gs) yang memicu email aktivasi.
    perluKonfirmasiBerhasilDoi:function(){
      return !!(this.doiTerpilih && this.doiTerpilih.status==='BERHASIL' && this.doiTerpilihStatusAsli!=='BERHASIL');
    }
  },
  watch:{
    cari:function(){this.halaman=1;},filterKluster:function(){this.halaman=1;},filterSinta:function(){this.halaman=1;},
    filterTimeliness:function(){this.halaman=1;},filterMigrasi:function(){this.halaman=1;},filterScopus:function(){this.halaman=1;},
    filterKualitas:function(){this.halaman=1;},filterMasalah:function(){this.halaman=1;}, // baru
    tab:function(v){var s=this;this.$nextTick(function(){if(v==='ringkasan')s.gambarGrafikBulanan();if(v==='apc')s.gambarGrafikApc();});},
    // baru: ganti jurnal/nominal setelah masuk tahap konfirmasi pencairan -> minta konfirmasi ulang
    'formPencairan.namaJurnal':function(){this.konfirmasiPencairan=false;},
    'formPencairan.jumlahDiajukan':function(){this.konfirmasiPencairan=false;},
    // baru: filter tabel Riwayat Laporan APC -> balik ke halaman 1
    filterBulanApc:function(){this.halamanApc=1;},filterKlusterApc:function(){this.halamanApc=1;}
    // dihapus: watcher 'formApc.total' (saran otomatis 50/50 honor/pengembangan) —
    // konsep itu digantikan sepenuhnya oleh mekanisme pencairan (lihat formPencairan).
  },
  created:function(){
    this.FIELD_PENGELOLA=[
      {k:'linkOjs',l:'Link OJS'},{k:'eIssn',l:'E-ISSN'},{k:'pIssn',l:'P-ISSN'},{k:'linkGaruda',l:'Link Garuda'},{k:'linkDoaj',l:'Link DOAJ'},
      {k:'apc',l:'Tarif APC'},{k:'linkApc',l:'Tautan informasi APC'},{k:'namaPengelola',l:'Nama pengelola'},
      {k:'email',l:'Email pengelola'},{k:'issue',l:'Frekuensi terbit'},{k:'jadwalTerbitan',l:'Jadwal terbitan'},
      {k:'artikelPerIssue',l:'Artikel per issue'},{k:'artikelPerTahun',l:'Artikel per tahun'}
    ];
    this.FIELD_ADMIN=this.FIELD_PENGELOLA.concat([
      {k:'kluster',l:'Kluster'},{k:'unitPengelola',l:'Unit pengelola'},{k:'statusOjs',l:'Status OJS'},
      {k:'catatanMigrasi',l:'Catatan migrasi'},{k:'statusAkreditasi',l:'Status akreditasi'},
      {k:'masaBerlakuSk',l:'Masa berlaku SK'},{k:'tanggalExpired',l:'Tanggal expired'},
      {k:'timeliness',l:'Timeliness'},{k:'performa',l:'Performa'},{k:'kuartil',l:'Kuartil Scopus'}
    ]);
    // baru: petunjuk pengisian per field, ditampilkan di form sunting agar data rusak tidak masuk lagi
    this.PETUNJUK_FIELD={
      linkOjs:'Alamat lengkap, contoh https://ejournal.upi.edu/index.php/namajurnal',
      linkGaruda:'Alamat lengkap dimulai http:// atau https://',
      linkDoaj:'Alamat lengkap dimulai http:// atau https://',
      linkApc:'Alamat lengkap dimulai http:// atau https://',
      email:'Satu alamat saja, contoh redaksi@upi.edu',
      issn:'Delapan karakter, contoh 2085-1243',
      artikelPerIssue:'Angka bulat saja',
      artikelPerTahun:'Angka bulat saja',
      kuartil:'Contoh SCOPUS Q2. Kosongkan bila belum terindeks Scopus',
      statusAkreditasi:'SINTA 1 sampai SINTA 6, atau Belum Akreditasi',
      jadwalTerbitan:'Sebut nama bulannya, contoh April dan Oktober'
    };
  },
  mounted:function(){
    document.addEventListener('keydown',this.tutupModalEsc); // baru: tutup modal aktif dengan Esc
    try{this.tema=localStorage.getItem('djpi-tema')||'auto';}catch(e){} // baru: preferensi tema
    this.terapkanTema();
    if(typeof google==='undefined'||!google.script||!google.script.run){this.tahap='login';this.pesanGalat='Buka melalui URL web app Apps Script yang berakhiran /exec.';return;}
    if(typeof TOKEN_AWAL==='string'&&TOKEN_AWAL){this.token=TOKEN_AWAL;this.muatDashboard(true);}else this.tahap='login';

      var j=(this.data&&this.data.journals||[]).find(function(x){return x.namaJurnal===nama;});
      if(j)this.bukaJurnal(j);
      else this.tampilkanToast('Detail jurnal "'+nama+'" tidak ada di cakupan Anda.');
    },
    eksporAkr:function(rows,namaFile){
      this.unduhExcel(rows.map(function(r){return{
        'Nama Jurnal':r.namaJurnal,Kluster:r.kluster,Akreditasi:r.statusAkreditasi,
        'Sisa Waktu':r.kedaluwarsa.label,
        'Skor Kesiapan':r.skor,'Kriteria Lulus':r.lulus,'Kriteria Gagal':r.gagal,'Perlu Dicek':r.perluCek,
        'Skor Kandidat':r.skorKandidat||'',
        Penghambat:(r.penghambat||[]).join('; '),Kekuatan:(r.alasan||[]).join('; ')
      };}),'Akreditasi',namaFile);
    },

    // baru: dipakai untuk menampilkan peringatan bila admin mencoba pindah ke
    // SIAP_DIPROSES padahal ISSN jurnal belum sah — server juga menolaknya,
    // ini hanya peringatan dini di sisi tampilan.
    issnJurnalSah:function(namaJurnal){
      if(!this.data || !this.data.journals) return false;
      var j=this.data.journals.find(function(x){return x.namaJurnal===namaJurnal;});
      return !!(j && (j.issnValid || j.eIssnValid || j.pIssnValid));
    },

    urlDoiValid:function(url){
      if(!url || typeof url!=='string') return false;
      var nilai=url.trim();
      if(!nilai) return false;
      try{
        var u=new URL(nilai);
        return u.protocol==='https:' || u.protocol==='http:';
      }catch(e){ return false; }
    },

    // baru: simpan perubahan status/catatan admin untuk usulan DOI yang sedang dibuka
    simpanStatusDoi:function(){
      var s=this;
      if(!this.doiTerpilih) return;
      this.menyimpanDoi=true;
      this.pesanModalDoi='';

      var payload={
        id_usulan:this.doiTerpilih.id_usulan,
        status:this.doiTerpilih.status,
        catatan_admin:this.doiTerpilih.catatan_admin||''
      };

      gs('ubahStatusUsulanDoi', s.token, payload)
        .then(function(hasil){
          if(!hasil || !hasil.ok){
            if(hasil && hasil.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error(
              (hasil && hasil.message) || 'Status usulan DOI gagal diperbarui.'
            );
          }

          var indeks=s.usulanDoi.findIndex(function(item){
            return item.id_usulan===hasil.item.id_usulan;
          });

          if(indeks!==-1){
            s.usulanDoi.splice(indeks,1,hasil.item);
          }

          s.doiTerpilih=hasil.item;
          s.doiTerpilihStatusAsli=hasil.item.status; // baru: sinkronkan acuan supaya simpan ulang tanpa ubah status tidak minta konfirmasi lagi
          s.konfirmasiSimpanDoi=false;

          if(typeof s.tampilkanToast==='function'){
            s.tampilkanToast('Status usulan DOI berhasil diperbarui.');
          }
        })
        .catch(function(err){
          s.pesanModalDoi=err && err.message
            ? err.message
            : 'Terjadi kesalahan saat memperbarui status DOI.';
          console.error('ubahStatusUsulanDoi gagal:',err);
        })
        .finally(function(){
          s.menyimpanDoi=false;
        });
    },

    // baru: kirim ulang tanda terima (pengajuan/aktivasi) dari modal detail usulan DOI
    kirimUlangReceipt:function(jenis){
      var s=this;
      if(!this.doiTerpilih) return;
      this.mengirimUlangReceipt[jenis]=true;
      this.pesanModalDoi='';

      var payload={ id_usulan:this.doiTerpilih.id_usulan, jenis:jenis };

      gs('kirimUlangReceiptDoi', s.token, payload)
        .then(function(hasil){
          if(!hasil || !hasil.ok){
            if(hasil && hasil.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error(
              (hasil && hasil.message) || 'Tanda terima gagal dikirim ulang.'
            );
          }

          var indeks=s.usulanDoi.findIndex(function(item){
            return item.id_usulan===hasil.item.id_usulan;
          });
          if(indeks!==-1){
            s.usulanDoi.splice(indeks,1,hasil.item);
          }
          s.doiTerpilih=hasil.item;

          if(typeof s.tampilkanToast==='function'){
            s.tampilkanToast('Tanda terima berhasil dikirim ulang.');
          }
        })
        .catch(function(err){
          s.pesanModalDoi=err && err.message
            ? err.message
            : 'Terjadi kesalahan saat mengirim ulang tanda terima.';
          console.error('kirimUlangReceiptDoi gagal:',err);
        })
        .finally(function(){
          s.mengirimUlangReceipt[jenis]=false;
        });
    },

    // ===== PIN Tetap Admin (tab Akun Saya) =====
    simpanPinTetap:function(){
      var s=this;
      this.pesanPinTetap='';
      if(!/^\d{6}$/.test(this.pinTetapBaru.trim())){
        this.pesanPinTetap='PIN tetap harus enam digit angka.';
        this.pesanPinTetapJenis='galat';
        return;
      }
      if(this.pinTetapBaru.trim()!==this.pinTetapUlang.trim()){
        this.pesanPinTetap='Kedua PIN tidak sama. Ulangi pengisian.';
        this.pesanPinTetapJenis='galat';
        return;
      }

      this.menyimpanPinTetap=true;
      gs('aturPinTetapAdmin', s.token, this.pinTetapBaru.trim())
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'PIN tetap gagal disimpan.');
          }
          s.pesanPinTetap=r.message;
          s.pesanPinTetapJenis='ok';
          s.pinTetapBaru='';
          s.pinTetapUlang='';
        })
        .catch(function(err){
          s.pesanPinTetap=err && err.message ? err.message : 'Gagal menyimpan PIN tetap.';
          s.pesanPinTetapJenis='galat';
        })
        .finally(function(){
          s.menyimpanPinTetap=false;
        });
    },

    nonaktifkanPinTetap:function(){
      var s=this;
      this.pesanPinTetap='';
      this.menyimpanPinTetap=true;
      gs('hapusPinTetapAdmin', s.token)
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'PIN tetap gagal dinonaktifkan.');
          }
          s.pesanPinTetap=r.message;
          s.pesanPinTetapJenis='ok';
          s.pinTetapBaru='';
          s.pinTetapUlang='';
        })
        .catch(function(err){
          s.pesanPinTetap=err && err.message ? err.message : 'Gagal menonaktifkan PIN tetap.';
          s.pesanPinTetapJenis='galat';
        })
        .finally(function(){
          s.menyimpanPinTetap=false;
        });
    },

    // ===== Pencairan APC (tab Pemasukan APC, admin-only) =====
    // baru: mencatat pengajuan pencairan. Alokasi 10% UPI / 2% DPPM dihitung ULANG
    // di server (catatPencairanApc di Code.gs) — previewAlokasi di sini murni
    // tampilan, bukan sumber kebenaran.
    kirimPencairan:function(){
      var s=this;
      this.pesanPencairan='';

      if(!this.formPencairan.namaJurnal){
        this.pesanPencairan='Pilih jurnal terlebih dahulu.';
        this.pesanPencairanJenis='galat';
        return;
      }
      if(!this.formPencairan.jumlahDiajukan || Number(this.formPencairan.jumlahDiajukan)<=0){
        this.pesanPencairan='Jumlah diajukan harus lebih dari nol.';
        this.pesanPencairanJenis='galat';
        return;
      }

      this.menyimpanPencairan=true;
      gs('catatPencairanApc', s.token, {
        namaJurnal:this.formPencairan.namaJurnal,
        jumlahDiajukan:this.formPencairan.jumlahDiajukan,
        catatan:this.formPencairan.catatan
      })
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Pencairan gagal dicatat.');
          }
          s.pesanPencairan=r.message;
          s.pesanPencairanJenis='ok';
          s.formPencairan={namaJurnal:'',jumlahDiajukan:null,catatan:''};
          s.konfirmasiPencairan=false;
          s.muatDashboard(); // segarkan KPI Dana Terserap/UPI/DPPM
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(r.message); }
        })
        .catch(function(err){
          s.pesanPencairan=err && err.message ? err.message : 'Gagal mencatat pencairan.';
          s.pesanPencairanJenis='galat';
        })
        .finally(function(){
          s.menyimpanPencairan=false;
        });
    },

    // ===== Template Email (tab Template Email, superadmin-only) =====
    muatTemplateEmail:function(){
      var s=this;
      this.memuatTemplateEmail=true;
      this.galatTemplateEmail='';
      gs('getTemplateEmailUntukAdmin', s.token)
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal memuat template email.');
          }
          s.daftarTemplateEmail=r.items;
          if(r.items.length){
            s.templateAktifKunci=r.items[0].kunci;
            s.draftTemplateEmail={subjek:r.items[0].subjek,isi:r.items[0].isi};
          }
        })
        .catch(function(err){
          s.galatTemplateEmail=err && err.message ? err.message : 'Gagal memuat template email.';
        })
        .finally(function(){
          s.memuatTemplateEmail=false;
        });
    },

    pilihTemplateEmail:function(){
      var t=this.templateAktifData;
      if(t) this.draftTemplateEmail={subjek:t.subjek,isi:t.isi};
    },

    labelLayoutLanding:function(kunci){
      return LABEL_LAYOUT_LANDING[kunci]||kunci;
    },

    simpanTemplateEmail:function(){
      var s=this;
      this.menyimpanTemplateEmail=true;
      this.galatTemplateEmail='';
      gs('simpanTemplateEmail', s.token, this.templateAktifKunci, {
        subjek:this.draftTemplateEmail.subjek,
        isi:this.draftTemplateEmail.isi
      })
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Template email gagal disimpan.');
          }
          var indeks=s.daftarTemplateEmail.findIndex(function(t){return t.kunci===r.item.kunci;});
          if(indeks!==-1) s.daftarTemplateEmail.splice(indeks,1,r.item);
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(r.message); }
        })
        .catch(function(err){
          s.galatTemplateEmail=err && err.message ? err.message : 'Gagal menyimpan template email.';
        })
        .finally(function(){
          s.menyimpanTemplateEmail=false;
        });
    },

    // ===== Review Profil Jurnal (tab draftProfil, superadmin-only) =====
    muatDraftProfilJurnal:function(){
      var s=this;
      this.memuatDraftProfil=true;
      this.galatDraftProfil='';
      gs('getDraftProfilJurnal', s.token)
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal memuat draft profil jurnal.');
          }
          s.draftProfilJurnal=r.items;
        })
        .catch(function(err){
          s.galatDraftProfil=err && err.message ? err.message : 'Gagal memuat draft profil jurnal.';
        })
        .finally(function(){
          s.memuatDraftProfil=false;
        });
    },

    bukaDetailDraftProfil:function(d){
      this.draftProfilTerpilih=Object.assign({},d);
      this.catatanTolakDraftInput='';
    },

    tutupDetailDraftProfil:function(){
      this.draftProfilTerpilih=null;
      this.catatanTolakDraftInput='';
    },

    setujuiDraftProfil:function(){
      var s=this, nama=this.draftProfilTerpilih.namaJurnal;
      this.memprosesDraftProfil=true;
      gs('setujuiDraftProfilJurnal', s.token, nama)
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal menyetujui draft.');
          }
          s.draftProfilJurnal=s.draftProfilJurnal.filter(function(x){return x.namaJurnal!==nama;});
          s.tutupDetailDraftProfil();
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(r.message); }
        })
        .catch(function(err){
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(err.message||'Gagal menyetujui draft.'); }
        })
        .finally(function(){
          s.memprosesDraftProfil=false;
        });
    },

    tolakDraftProfil:function(){
      if(!this.catatanTolakDraftInput.trim()){
        if(typeof this.tampilkanToast==='function'){ this.tampilkanToast('Alasan penolakan wajib diisi.'); }
        return;
      }
      var s=this, nama=this.draftProfilTerpilih.namaJurnal;
      this.memprosesDraftProfil=true;
      gs('tolakDraftProfilJurnal', s.token, nama, this.catatanTolakDraftInput.trim())
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal menolak draft.');
          }
          s.draftProfilJurnal=s.draftProfilJurnal.filter(function(x){return x.namaJurnal!==nama;});
          s.tutupDetailDraftProfil();
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(r.message); }
        })
        .catch(function(err){
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(err.message||'Gagal menolak draft.'); }
        })
        .finally(function(){
          s.memprosesDraftProfil=false;
        });
    },

    // ===== Layout Landing (tab layoutLanding, superadmin-only) =====
    muatPengaturanLanding:function(){
      var s=this;
      this.memuatPengaturanLanding=true;
      this.galatPengaturanLanding='';
      gs('getPengaturanLanding', s.token)
        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal memuat pengaturan layout.');
          }
          s.pengaturanLanding=r.items;
        })
        .catch(function(err){
          s.galatPengaturanLanding=err && err.message ? err.message : 'Gagal memuat pengaturan layout.';
        })
        .finally(function(){
          s.memuatPengaturanLanding=false;
        });
    },

    simpanPengaturanLandingKlik:function(){

      this.menyimpanPengaturanLanding=true;

        .then(function(r){
          if(!r || !r.ok){
            if(r && r.code==='SESSION_EXPIRED'){ s.sesiBerakhir(); return; }
            throw new Error((r && r.message) || 'Gagal menyimpan pengaturan layout.');
          }
          if(typeof s.tampilkanToast==='function'){ s.tampilkanToast(r.message); }
        })
        .catch(function(err){
          s.galatPengaturanLanding=err && err.message ? err.message : 'Gagal menyimpan pengaturan layout.';
        })
        .finally(function(){
          s.menyimpanPengaturanLanding=false;
        });
    }
  },
  beforeUnmount:function(){this.hancurkanGrafik();document.removeEventListener('keydown',this.tutupModalEsc);}
}).mount('#app');
</script>
